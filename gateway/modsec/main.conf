# ==============================================================================
# ModSecurity v3 Main Configuration (C0 Baseline)
# ==============================================================================

# Trạng thái mặc định: DetectionOnly (có thể đổi sang On khi test Blocking)
SecRuleEngine DetectionOnly

# Cho phép đọc và kiểm tra Body của Request
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Cho phép JSON Body Parser (cực kỳ quan trọng cho POST /login và POST /fetch)
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200000,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON"

# Cấu hình Audit Log theo chuẩn Serial JSON
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/modsec/audit.log
SecAuditLogStorageDir /var/log/modsec/

# Cấu hình Debug Log (tạm tắt trong production để tiết kiệm I/O)
SecDebugLog /var/log/modsec/debug.log
SecDebugLogLevel 0
