# ==============================================================================
# WAFBench Gateway Nginx Reverse Proxy Configuration
# Subdomain Partitioning: app.wafbench.local & dashboard.wafbench.local
# ==============================================================================

# 1. Target Vulnerable Application (WAF Protected)
server {
    listen 80;
    server_name app.wafbench.local localhost "";

    # Preserve and propagate correlation ID (X-Request-ID)
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SECURITY CONSTRAINT: Forbid invoking application reset endpoint via WAF gateway port (:8080)
    location = /health/reset {
        return 403 '{"error": "Forbidden: Reset is only allowed via direct loopback"}';
        add_header Content-Type application/json;
    }

    # Reverse proxy inspected traffic upstream to vulnerable-app container
    location / {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

# 2. WAFBench Analytics Dashboard & Forensic Console
server {
    listen 80;
    server_name dashboard.wafbench.local;

    # Disable ModSecurity inspection for dashboard analytics to avoid false-positive blocking
    # of legitimate Streamlit telemetry payloads and charts
    modsecurity off;

    location / {
        proxy_pass http://${DASHBOARD_HOST}:${DASHBOARD_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit WebSocket and Long-polling Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
