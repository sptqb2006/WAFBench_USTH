server {
    listen 80;
    server_name localhost;

    # Kích hoạt ModSecurity v3
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # Bảo lưu và chuyển tiếp correlation ID (X-Request-ID)
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # NGINX ACCESS LOG với X-Request-ID
    log_format wb_combined '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_request_id"';
    access_log /var/log/nginx/access.log wb_combined;

    # YÊU CẦU BẢO MẬT: Nghiêm cấm gọi endpoint reset ứng dụng qua cổng WAF (:8080)
    location = /health/reset {
        return 403 '{"error": "Forbidden: Reset is only allowed via direct loopback"}';
        add_header Content-Type application/json;
    }

    # Proxy toàn bộ traffic được duyệt tới container vulnerable-app
    location / {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
