# ==============================================================================
# C1 Rule Exclusions (False Positive Tuning)
# ==============================================================================
# File này lưu các cấu hình loại trừ (exclusions) khi chuyển từ baseline C0 -> C1
# Xử lý False Positive do dấu nháy đơn trong tên (O'Brien, O'Reilly) trên endpoint /search

# Rule 100002: Exclude Rule 942100 (SQLi) on ARGS:q for /search
SecRule REQUEST_URI "@beginsWith /search" \
    "id:100002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:q"
