server {
    listen 80;
    server_name localhost;

    # Preserve and propagate correlation ID (X-Request-ID)
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SECURITY CONSTRAINT: Forbid invoking application reset endpoint via WAF gateway port (:8080)
    location = /health/reset {
        return 403 '{"error": "Forbidden: Reset is only allowed via direct loopback"}';
        add_header Content-Type application/json;
    }

    # Reverse proxy inspected traffic upstream to vulnerable-app container
    location / {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
