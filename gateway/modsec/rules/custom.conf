# ==============================================================================
# Custom Rules: Rule 200001 for SSRF Mitigation on POST /fetch
# ==============================================================================

# Block requests targeting /metadata on POST /fetch when parsing JSON body 'url'
# Note: This rule does not match benign requests such as /public/avatar.png
SecRule REQUEST_URI "@streq /fetch" \
    "id:1000001,\
    phase:2,\
    block,\
    msg:'SSRF Attempt to Internal Metadata Service Detected',\
    log,\
    auditlog,\
    chain"
    SecRule ARGS:json.url "@rx (?:127\.0\.0\.1|localhost|mock-internal)(?::[0-9]+)?/metadata" \
        "setvar:tx.inbound_anomaly_score_threshold=+5"
